<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lost In Translation</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f4ee;
      color: #1f1f1f;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
    .wrap {
      width: min(860px, 92vw);
      text-align: center;
      padding: 32px 18px 24px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    p {
      margin: 0 0 18px;
      opacity: 0.85;
    }
    img {
      width: min(100%, 620px);
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16);
      display: block;
      margin: 0 auto 20px;
    }
    .project-pagination {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .project-pagination button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      background: #1f1f1f;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Lost In Translation</h1>
    <p>Book project placeholder. Full page layout can be added here.</p>
    <img src="project-6-1.png" alt="Lost In Translation cover preview" />
    <nav class="project-pagination" aria-label="Project navigation">
      <button type="button" onclick="window.location.href='../5/index.html'">Previous</button>
      <button type="button" onclick="window.location.href='../7/index.html'">Next</button>
    </nav>
  </main>

</html>
