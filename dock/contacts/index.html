<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts</title>
  <link rel="stylesheet" href="../../shared/base.css?v=1" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <main class="contacts-page" aria-label="Contact profile">
    <section class="contacts-shell">
      <header class="identity">
        <figure class="avatar-wrap">
          <img class="avatar" src="../../assets/user.jpg" alt="Tanaya Agarwal profile photo" />
        </figure>
        <p class="pronouns">SHE, HER, HERS</p>
        <h1>Tanaya Agarwal</h1>
      </header>

      <section class="share-card" aria-label="Share settings">
        <div class="share-left">
          <img class="share-avatar" src="../../assets/user.jpg" alt="" aria-hidden="true" />
          <div class="share-copy">
            <p class="share-title">Shared Name and Photo</p>
            <p class="share-subtitle">Sharing Off</p>
          </div>
        </div>
        <span class="chevron" aria-hidden="true">›</span>
      </section>

      <section class="info-card" aria-label="Contact details">
        <article class="info-row">
          <p class="label">mobile</p>
          <p class="value">+1 (347) 544-1628</p>
        </article>
        <article class="info-row">
          <p class="label">work</p>
          <p class="value">tanayaagarwal11@gmail.com</p>
        </article>
        <article class="info-row">
          <p class="label">home</p>
          <p class="value">New York NY</p>
          <p class="value">United States</p>
        </article>
        <article class="info-row">
          <p class="label">other</p>
          <p class="value">Mumbai MH</p>
          <p class="value">India</p>
        </article>
        <article class="info-row">
          <p class="label">Notes</p>
        </article>
      </section>

      <section class="message-card" aria-label="Send message">
        <p>Send Message</p>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
