<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts</title>
  <link rel="stylesheet" href="../../shared/base.css?v=1" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <main class="contacts-page" aria-label="Contact profile">
    <section class="contacts-shell">
      <header class="identity">
        <figure class="avatar-wrap">
          <img class="avatar" src="../../assets/user.webp" alt="Tanaya Agarwal profile photo" fetchpriority="high" />
        </figure>
        <p class="pronouns">SHE, HER, HERS</p>
        <h1>Tanaya Agarwal</h1>
      </header>

      <section class="share-card" aria-label="Share settings">
        <div class="share-left">
          <img class="share-avatar" src="../../assets/user.webp" alt="" aria-hidden="true" loading="lazy" decoding="async" />
          <div class="share-copy">
            <p class="share-title">Shared Name and Photo</p>
            <p class="share-subtitle">Sharing Off</p>
          </div>
        </div>
        <span class="chevron" aria-hidden="true">›</span>
      </section>

      <section class="info-card" aria-label="Contact details">
        <article class="info-row">
          <p class="label">mobile</p>
          <p class="value">+1 (347) 544-1628</p>
        </article>
        <article class="info-row">
          <p class="label">work</p>
          <p class="value">tanayaagarwal11@gmail.com</p>
        </article>
        <article class="info-row">
          <p class="label">home</p>
          <p class="value">New York NY</p>
          <p class="value">United States</p>
        </article>
        <article class="info-row">
          <p class="label">other</p>
          <p class="value">Mumbai MH</p>
          <p class="value">India</p>
        </article>
        <article class="info-row">
          <p class="label">Notes</p>
        </article>
      </section>

      <a
        class="message-card"
        href="sms:+13475441628"
        target="_top"
        aria-label="Send a message to +1 (347) 544-1628"
      >
        <p>Send Message</p>
      </a>

      <a
        class="message-card"
        href="mailto:tanayaagarwal11@gmail.com?subject=Hello%20Tanaya"
        target="_top"
        aria-label="Send an email to tanayaagarwal11@gmail.com"
      >
        <p>Send Email</p>
      </a>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
