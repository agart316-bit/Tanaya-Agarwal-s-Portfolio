<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos</title>
  <link rel="stylesheet" href="../../shared/base.css?v=1" />
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <main class="photos-page">
    <header class="photos-header">
      <h1>Photos</h1>
    </header>

    <section class="photo-grid" aria-label="Photo gallery">
      <figure class="photo-tile"><img src="../../assets/about.jpg" alt="About cover" loading="lazy" /></figure>
      <figure class="photo-tile"><img src="../../assets/user.jpg" alt="Portrait" loading="lazy" /></figure>
      <figure class="photo-tile"><img src="../../assets/project-1.png" alt="Project 1 cover" loading="lazy" /></figure>
      <figure class="photo-tile"><img src="../../assets/project-5.png" alt="Project 5 cover" loading="lazy" /></figure>
      <figure class="photo-tile"><img src="../../assets/project-8.png" alt="Project 8 cover" loading="lazy" /></figure>
      <figure class="photo-tile"><img src="../../assets/project-10.png" alt="Project 10 cover" loading="lazy" /></figure>
    </section>
  </main>
</body>
</html>
